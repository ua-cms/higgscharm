# H+c 3FS (massive charm, pp -> h c c~, rebuilt gridpack "-pythia8new") for the 2024 3FS/4FS stitching, added 2026-11-16 (user).
# Two Nano datasets = ONE 3FS sample for the stitching (the builder sums the sumw of every Stitch3FS_cH_* partition):
#   v1new: 582 files / 1.744M events. 249 lumis appear in two files with the SAME (run, lumi, event) numbers but DIFFERENT
