# H+c SMEFT workflow — Combine template production
#
# Follows the event selection and fit strategy of Breugelmans et al. (arXiv:2604.09225).
# No MVA is used; fit observables are directly the kinematic discriminators from the paper.
#
# Three SMEFT operators:
#   cuGRe22 (c̃_cG)  — fit variable: leading jet pT, pre-selection: m(H)∈[100,130], m(H+jet)<1 TeV
#   cuHRe22 (c̃_cH)  — fit variable: m(H) [70,250]
#   cHGRe   (c̃_HG)  — fit variable: leading jet pT (no extra cut)
#
# Signal templates (one dataset key per Combine component):
#   smeft_sm        — SM (NP==0), shared baseline for all operators
#   smeft_cug_int   — cuGRe22 INT  (NP<=1, NP^2==1)
#   smeft_cug_quad  — cuGRe22 QUAD (NP==1)
#   smeft_cuh_int   — cuHRe22 INT
#   smeft_cuh_quad  — cuHRe22 QUAD
#   smeft_chg_int   — cHG INT
#   smeft_chg_quad  — cHG QUAD
#
# Categories:
#   base        — atleast_one_jet: inclusive; covers smeft_cuh (m4l) and smeft_chg (jet pT) fits
#   smeft_cug   — base + m(H)∈[100,130]: used for cuGRe22 jet-pT fit
#                 NOTE: additional m(H+jet) < 1 TeV cut applied in post-processing
#   ctagged     — atleast_one_cjet: optional c-tagging enriched category (beyond pheno paper)
#
# Key differences vs hplusc.yaml:
#   - requires >= 1 jet (any), NOT exactly one c-tagged jet
#   - adds SMEFT signal dataset keys
#   - adds Combine-template binned observables: leading_jet_pt (10 bins) and m4l (13 bins)

datasets:
  data:
    - muon
    - double_muon
    - electron
    - double_electron
    - muon_electron
  mc:
    # Irreducible backgrounds only (reducible DY/ttbar excluded for now)
    - higgs       # ggH + VBF + VH + ttH (nnlopsWeight applied for ggH via correction_manager)
    - hb          # H+b
    - qqtozz      # qq→ZZ NLO (Powheg); NNLO/NLO K(m_4l) applied in make_templates step
    - ggtozz      # gg→ZZ LO (MCFM); NLO/LO K(m_4l) applied in make_templates step
  signal:
    # Method B: separate INT/QUAD templates (for 3-template Combine decomposition)
    - smeft_sm
    - smeft_cug_int
    - smeft_cug_quad
    - smeft_cuh_int
    - smeft_cuh_quad
    - smeft_chg_int
    - smeft_chg_quad
    # Method A: FULL (NP<=1) samples with LHEReweightingWeight scan
    # Used for polynomial fit μ(c̃) = 1 + μ_int·c̃ + μ_quad·c̃² (fit_mu_polynomial.py)
    - smeft_cug_full
    - smeft_cuh_full
    - smeft_chg_full

object_selection:
  muons:
    field: events.Muon
    add_cut:
      is_loose:
        - events.Muon.pt > 5
        - np.abs(events.Muon.eta) < 2.4
        - np.abs(events.Muon.dxy) < 0.5
        - np.abs(events.Muon.dz) < 1
        - events.Muon.isGlobal | events.Muon.isTracker
      is_relaxed:
        - objects['muons'].is_loose
        - np.abs(events.Muon.sip3d) < 4
      is_tight:
        - objects['muons'].is_loose
        - objects['muons'].is_relaxed
        - events.Muon.isPFcand | ((events.Muon.highPtId > 0) & (events.Muon.pt > 200))
  electrons:
    field: events.Electron
    add_cut:
      is_loose:
        - events.Electron.pt > 7
        - np.abs(events.Electron.eta) < 2.5
        - np.abs(events.Electron.dxy) < 0.5
        - np.abs(events.Electron.dz) < 1
      is_relaxed:
        - objects['electrons'].is_loose
        - np.abs(events.Electron.sip3d) < 4
      is_tight:
        - objects['electrons'].is_loose
        - objects['electrons'].is_relaxed
        - working_points.electron_id(events, 'bdt')
    cuts:
      - delta_r_higher(events.Electron, objects['muons'], 0.05)
  fsr_photons:
    field: events.FsrPhoton
    cuts:
      - events.FsrPhoton.pt > 2
      - np.abs(events.FsrPhoton.eta) < 2.4
      - events.FsrPhoton.relIso03 < 1.8
  leptons:
    field: select_zzto4l_leptons_hczz
  zcandidates:
    field: select_zcandidates_hczz
    add_cut:
      is_ossf:
        - objects['zcandidates'].l1.pdgId == -objects['zcandidates'].l2.pdgId
      is_sr:
        - objects['zcandidates'].is_ossf
        - objects['zcandidates'].l1.is_tight & objects['zcandidates'].l2.is_tight
    cuts:
      - (objects['zcandidates'].p4.mass > 12) & (objects['zcandidates'].p4.mass < 120)
  zzcandidates:
    field: select_zzcandidates
    cuts:
      - objects['zzcandidates'].z1.is_sr & objects['zzcandidates'].z2.is_sr
      - (objects['zzcandidates'].z1.p4 + objects['zzcandidates'].z2.p4).mass > 70
  best_zzcandidate:
    field: select_best_zzcandidate
  zz_mass_4mu:
    field: select_mass_4mu_sr
  zz_mass_4e:
    field: select_mass_4e_sr
  zz_mass_2mu2e:
    field: select_mass_2mu2e_sr
  zz_mass_2e2mu:
    field: select_mass_2e2mu_sr
  jets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
  cjets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
      - working_points.jet_ctagging(events, 'loose', year)
  zzcandidate_cjet_dphi_inclusive:
    field: select_dphi_inclusive
  zzcandidate_cjet_dphi_4e:
    field: select_dphi_4e
  zzcandidate_cjet_dphi_4mu:
    field: select_dphi_4mu
  zzcandidate_cjet_dphi_2mu2e:
    field: select_dphi_2mu2e
  zzcandidate_cjet_dphi_2e2mu:
    field: select_dphi_2e2mu

event_selection:
  hlt_paths:
    - SingleMu
    - DiMu
    - TriMu
    - SingleEle
    - DiEle
    - MuEle
  selections:
    trigger: get_zzto4l_trigger_mask(events, hlt_paths, dataset, year)
    lumimask: get_lumi_mask(events, year)
    atleast_one_goodvertex: events.PV.npvsGood > 0
    atleast_one_zz: ak.num(objects['zzcandidates']) >= 1
    # Pheno paper: require leading jet for fit observable (any jet, not c-tagged)
    atleast_one_jet: ak.num(objects['jets']) >= 1
    # Optional: c-tagged jet (beyond pheno paper)
    atleast_one_cjet: ak.num(objects['cjets']) >= 1
  categories:
    # Inclusive: used for smeft_cuh (m4l discriminator) and smeft_chg (jet pT discriminator)
    base:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - atleast_one_zz
      - atleast_one_jet
    # cuGRe22 category: same selection as base for now
    # m(H) in [100, 130] and m(H+jet) < 1 TeV applied in post-processing (Combine template step)
    smeft_cug:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - atleast_one_zz
      - atleast_one_jet
    # c-tagging enriched: optional, beyond pheno paper (§8.10 of analysis doc)
    ctagged:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - atleast_one_zz
      - atleast_one_cjet

corrections:
  objects:
    - jet
    - jetveto
    - muon
    - electron
  object_shifts: false
  event_weights:
    genWeight: true
    pileupWeight: true
    partonshowerWeight: true
    lhepdfWeight: true
    lhescaleWeight: true
    nnlopsWeight: true
    ggzzKfactor: true
    qqzzKfactor: true
    electron:
      - id: false
      - reco: true
      - trigger: false
    ctagging:
      - wp: loose

histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    # =========================================================================
    # Primary Combine fit observables (pheno paper §6)
    # =========================================================================

    # c̃_cG and c̃_HG fits: leading jet pT (~10 bins, pheno paper Table 3 / Fig. 3)
    leading_jet_pt:
      type: Variable
      edges: [20, 40, 60, 80, 100, 130, 160, 200, 260, 350, 500]
      label: Leading Jet $p_T$ [GeV]
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].pt

    # c̃_cH fit: m(H), 13 bins over [70, 250] (pheno paper Table 3)
    m4l:
      type: Variable
      edges: [70, 80, 90, 100, 105, 110, 115, 120, 125, 130, 140, 160, 200, 250]
      label: $m_{4\ell}$ [GeV]
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).mass

    # =========================================================================
    # Inclusive ZZ observables
    # =========================================================================
    zz_mass_inclusive:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\ell}$ [GeV]
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).mass

    zz_pt_inclusive:
      type: Regular
      bins: 40
      start: 0
      stop: 400
      label: $p_T(4\ell)$ [GeV]
      expression: objects['best_zzcandidate'].p4.pt

    # =========================================================================
    # Per-channel m4l (for channel decomposition: 4mu, 4e, 2mu2e, 2e2mu)
    # =========================================================================
    zz_mass_4mu:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\mu}$ [GeV]
      expression: objects['zz_mass_4mu']

    zz_mass_4e:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4e}$ [GeV]
      expression: objects['zz_mass_4e']

    zz_mass_2mu2e:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{2\mu 2e}$ [GeV]
      expression: objects['zz_mass_2mu2e']

    zz_mass_2e2mu:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{2e2\mu}$ [GeV]
      expression: objects['zz_mass_2e2mu']

    # =========================================================================
    # Jet kinematics
    # =========================================================================
    jet_multiplicity:
      type: Integer
      start: 0
      stop: 14
      label: Jet Multiplicity
      expression: ak.num(objects['jets'])

    jet_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: Jets $p_T$ [GeV]
      expression: objects['jets'].pt

    jet_eta:
      type: Regular
      bins: 50
      start: -2.4
      stop: 2.4
      label: Jets $\eta$
      expression: objects['jets'].eta

    jet_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: Jets $\phi$
      expression: objects['jets'].phi

    # =========================================================================
    # Leading and subleading jet c-tagger scores
    # UParT (Run3 v13+) -> PNet (Run3 v12) -> DeepFlav (Run2) fallback
    # =========================================================================
    leadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsL
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].btagUParTAK4CvL if hasattr(objects['jets'], 'btagUParTAK4CvL') else ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvL if hasattr(objects['jets'], 'btagPNetCvL') else ak.pad_none(objects['jets'], target=2)[:, 0].btagDeepFlavCvL

    leadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsB
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].btagUParTAK4CvB if hasattr(objects['jets'], 'btagUParTAK4CvB') else ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvB if hasattr(objects['jets'], 'btagPNetCvB') else ak.pad_none(objects['jets'], target=2)[:, 0].btagDeepFlavCvB

    leadingjet_flavour:
      type: IntCategory
      categories:
        - 0
        - 4
        - 5
      label: Leading Jet HadronFlavour
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].hadronFlavour

    subleadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Subleading Jet CvsL
      expression: ak.pad_none(objects['jets'], target=2)[:, 1].btagUParTAK4CvL if hasattr(objects['jets'], 'btagUParTAK4CvL') else ak.pad_none(objects['jets'], target=2)[:, 1].btagPNetCvL if hasattr(objects['jets'], 'btagPNetCvL') else ak.pad_none(objects['jets'], target=2)[:, 1].btagDeepFlavCvL

    subleadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Subleading Jet CvsB
      expression: ak.pad_none(objects['jets'], target=2)[:, 1].btagUParTAK4CvB if hasattr(objects['jets'], 'btagUParTAK4CvB') else ak.pad_none(objects['jets'], target=2)[:, 1].btagPNetCvB if hasattr(objects['jets'], 'btagPNetCvB') else ak.pad_none(objects['jets'], target=2)[:, 1].btagDeepFlavCvB

    subleadingjet_flavour:
      type: IntCategory
      categories:
        - 0
        - 4
        - 5
      label: Subleading Jet HadronFlavour
      expression: ak.pad_none(objects['jets'], target=2)[:, 1].hadronFlavour

    # =========================================================================
    # c-jet observables (ctagged category)
    # =========================================================================
    cjets_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: c-Jet $p_T$ [GeV]
      expression: objects['cjets'].pt

    cjets_eta:
      type: Regular
      bins: 50
      start: -2.4
      stop: 2.4
      label: c-Jet $\eta$
      expression: objects['cjets'].eta

    cjets_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: c-Jet $\phi$
      expression: objects['cjets'].phi

    cjets_h_dphi_inclusive:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4\ell})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_inclusive'])

    cjets_h_dphi_4e:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4e})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_4e'])

    cjets_h_dphi_4mu:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4\mu})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_4mu'])

    cjets_h_dphi_2mu2e:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{2\mu 2e})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_2mu2e'])

    cjets_h_dphi_2e2mu:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{2e2\mu})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_2e2mu'])

  layout:
    combine_fit:
      - leading_jet_pt
      - m4l
    zz_inclusive:
      - zz_mass_inclusive
      - zz_pt_inclusive
    zz_mass_4mu:
      - zz_mass_4mu
    zz_mass_4e:
      - zz_mass_4e
    zz_mass_2e2mu:
      - zz_mass_2e2mu
    zz_mass_2mu2e:
      - zz_mass_2mu2e
    jet_multiplicity:
      - jet_multiplicity
    jet:
      - jet_pt
      - jet_eta
      - jet_phi
    leading_jet:
      - leadingjet_flavour
      - leadingjet_cvsl
      - leadingjet_cvsb
    subleading_jet:
      - subleadingjet_flavour
      - subleadingjet_cvsl
      - subleadingjet_cvsb
    cjet:
      - cjets_pt
      - cjets_eta
      - cjets_phi
    cjets_h_dphi_inclusive:
      - cjets_h_dphi_inclusive
    cjets_h_dphi_4e:
      - cjets_h_dphi_4e
    cjets_h_dphi_4mu:
      - cjets_h_dphi_4mu
    cjets_h_dphi_2mu2e:
      - cjets_h_dphi_2mu2e
    cjets_h_dphi_2e2mu:
      - cjets_h_dphi_2e2mu
