# Simplified Z+X Control Region config — SS (same-sign) fake-rate estimation
#
# Same skeleton/trimming approach as hplusc_mva_4class_CR.yaml -> hplus_FR.yaml,
# but the Z2 leg is built from the SAME-SIGN control region (is_sscr) defined in
# zplus_ss.yaml instead of the opposite-sign 1F/2F control regions. Because the
# SS selection is a single region (no 3P1F/2P2F split), there is only one
# category here (CR_SS) and the mass/lepton branches are the four
# flavor-specific ones (4e / 4mu / 2e2mu / 2mu2e) rather than m4l_3p1f/m4l_2p2f.
#
# Kept only the branches actually needed for an SS fake-rate lookup:
#   - z2.l1/z2.l2 pt, eta, pdgId for fake-rate lookup + final-state tag
#   - zll_mass_{4e,4mu,2e2mu,2mu2e}_sscr for the SR mass-window cut, split by
#     final state (matches the per-flavor mass functions in zplus_ss.yaml)
#   - cjet_HT, kept only because SR_CJET_REQ in the script CAN be flipped on
#     (it's False/unused by default — drop the `cjets` object_selection and
#     the `cjet_HT` axis below if you never plan to enable it)
#   - weight_nominal comes from histogram_config.add_weight, not from `axes`
#
# All extra MVA kinematics (Z1/Z2 4-vectors, deltaR, phi, jet pt/eta/btag, nSV,
# etc.) has been removed since the script never reads them.

datasets:
  data:
    - muon
    - double_muon
    - electron
    - double_electron
    - muon_electron
  mc:
    - dy_nlo
    - wz
    - tt_semileptonic
    - qqtozz
    # - ggtozz

object_selection:
  muons:
    field: events.Muon
    add_cut:
      is_loose:
        - events.Muon.pt > 5
        - np.abs(events.Muon.eta) < 2.4
        - np.abs(events.Muon.dxy) < 0.5
        - np.abs(events.Muon.dz) < 1
        - events.Muon.isGlobal | events.Muon.isTracker
      is_relaxed:
        - objects['muons'].is_loose
        - np.abs(events.Muon.sip3d) < 4
      is_tight:
        - objects['muons'].is_loose
        - objects['muons'].is_relaxed
        - events.Muon.isPFcand | ((events.Muon.highPtId > 0) & (events.Muon.pt > 200))
  electrons:
    field: events.Electron
    add_cut:
      is_loose:
        - events.Electron.pt > 7
        - np.abs(events.Electron.eta) < 2.5
        - np.abs(events.Electron.dxy) < 0.5
        - np.abs(events.Electron.dz) < 1
      is_relaxed:
        - objects['electrons'].is_loose
        - np.abs(events.Electron.sip3d) < 4
      is_tight:
        - objects['electrons'].is_loose
        - objects['electrons'].is_relaxed
        - working_points.electron_id(events, 'bdt')
    cuts:
      - delta_r_higher(events.Electron, objects['muons'], 0.05)
  fsr_photons:
    field: events.FsrPhoton
    cuts:
      - events.FsrPhoton.pt > 2
      - np.abs(events.FsrPhoton.eta) < 2.4
      - events.FsrPhoton.relIso03 < 1.8
  leptons:
    field: select_zzto4l_leptons
  zcandidates:
    field: select_zcandidates
    add_cut:
      is_ossf:
        - objects['zcandidates'].l1.pdgId == -objects['zcandidates'].l2.pdgId
      is_ss:
        - objects['zcandidates'].l1.pdgId == objects['zcandidates'].l2.pdgId
      is_sr:
        - objects['zcandidates'].is_ossf
        - (1*objects['zcandidates'].l1.is_tight + 1*objects['zcandidates'].l2.is_tight) == 2
      is_sscr:
        - objects['zcandidates'].is_ss
        - objects['zcandidates'].l1.is_relaxed
        - objects['zcandidates'].l2.is_relaxed
    cuts:
      - (objects['zcandidates'].p4.mass > 12) & (objects['zcandidates'].p4.mass < 120)
  zzcandidates:
    field: select_zzcandidates
    cuts:
      - objects['zzcandidates'].z1.is_sr & objects['zzcandidates'].z2.is_sr
      - (objects['zzcandidates'].z1.p4 + objects['zzcandidates'].z2.p4).mass > 70
  zllcandidates_ss:
    field: select_zllcandidates_os
    cuts:
      - objects['zllcandidates_ss'].z1.is_sr & objects['zllcandidates_ss'].z2.is_sscr
      - (objects['zllcandidates_ss'].z1.p4 + objects['zllcandidates_ss'].z2.p4).mass > 100
  best_zllcandidate_sscr:
    field: select_best_sscr_zllcandidate
  zll_mass_4e_sscr:
    field: select_mass_4e_sscr
  zll_mass_2e2mu_sscr:
    field: select_mass_2e2mu_sscr
  zll_mass_2mu2e_sscr:
    field: select_mass_2mu2e_sscr
  zll_mass_4mu_sscr:
    field: select_mass_4mu_sscr
  # Only needed to support the optional cjet_HT axis (SR_CJET_REQ toggle in the
  # script). Delete this block + cjet_HT axis below if that toggle is never used.
  cjets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
      - working_points.jet_ctagging(events, 'loose', year)

event_selection:
  hlt_paths:
    - SingleMu
    - DiMu
    - TriMu
    - SingleEle
    - DiEle
    - MuEle
  selections:
    trigger: get_zzto4l_trigger_mask(events, hlt_paths, dataset, year)
    lumimask: get_lumi_mask(events, year)
    atleast_one_goodvertex: events.PV.npvsGood > 0
    no_sr_candidate: ak.num(objects['zzcandidates']) == 0
    atleast_one_zll: ak.num(objects['zllcandidates_ss']) >= 1
  categories:
    CR_SS:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - no_sr_candidate
      - atleast_one_zll

corrections:
  object:
    - jec
    - jet_vetomaps
    - muon_ss
    - electon_ss
  object_shifts: false
  event_weights:
    genWeight: true
    pileupWeight: true
    partonshowerWeight: false
    lhepdfWeight: false
    lhescaleWeight: false
    nnlopsWeight: false
    electron:
      - id: false
      - reco: true
      - trigger: false

histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    # --- mass window cut variables (SR_M4L_MIN/MAX in the script), split by
    #     final state since the SS region isn't split into 3P1F/2P2F ---
    zll_mass_4e_sscr:
      type: Regular
      bins: 40
      start: 70
      stop: 870
      label: $m_{4e}$ [GeV]
      expression: objects['zll_mass_4e_sscr']
    zll_mass_2mu2e_sscr:
      type: Regular
      bins: 40
      start: 70
      stop: 870
      label: $m_{2\mu2e}$ [GeV]
      expression: objects['zll_mass_2mu2e_sscr']
    zll_mass_2e2mu_sscr:
      type: Regular
      bins: 40
      start: 70
      stop: 870
      label: $m_{2e2\mu}$ [GeV]
      expression: objects['zll_mass_2e2mu_sscr']
    zll_mass_4mu_sscr:
      type: Regular
      bins: 40
      start: 70
      stop: 870
      label: $m_{4\mu}$ [GeV]
      expression: objects['zll_mass_4mu_sscr']

    # --- failing-pair (Z2) lepton info: fake rate lookup + final-state tag ---
    l1_pt:
      type: Variable
      edges: [5, 7, 10, 20, 30, 40, 50, 80]
      label: $p_T(\ell_3)$ [GeV]
      expression: objects['best_zllcandidate_sscr'].z2.l1.pt
    l1_eta:
      type: Regular
      bins: 50
      start: 0
      stop: 2.5
      label: $|\eta(\ell_3)|$
      expression: np.abs(objects['best_zllcandidate_sscr'].z2.l1.eta)
    l1_flavor:
      type: IntCategory
      categories: [11, 13]
      label: $\ell_3$ pdgId
      expression: np.abs(objects['best_zllcandidate_sscr'].z2.l1.pdgId)
    l1_missing_hits:
      type: Integer
      start: 0
      stop: 10
      label: $\ell_3$ n_missing_hits
      expression: objects['best_zllcandidate_sscr'].z2.l1.lostHits
    l2_pt:
      type: Variable
      edges: [5, 7, 10, 20, 30, 40, 50, 80]
      label: $p_T(\ell_4)$ [GeV]
      expression: objects['best_zllcandidate_sscr'].z2.l2.pt
    l2_eta:
      type: Regular
      bins: 50
      start: 0
      stop: 2.5
      label: $|\eta(\ell_4)|$
      expression: np.abs(objects['best_zllcandidate_sscr'].z2.l2.eta)
    l2_flavor:
      type: IntCategory
      categories: [11, 13]
      label: $\ell_4$ pdgId
      expression: np.abs(objects['best_zllcandidate_sscr'].z2.l2.pdgId)
    l2_missing_hits:
      type: Integer
      start: 0
      stop: 10
      label: $\ell_4$ n_missing_hits
      expression: objects['best_zllcandidate_sscr'].z2.l2.lostHits

    # --- optional: only read by the script when SR_CJET_REQ is toggled True ---
    cjet_HT:
      type: Regular
      bins: 50
      start: 0
      stop: 1000
      label: $H_T$ (c-Jets) [GeV]
      expression: ak.sum(objects['cjets'].pt, axis=1)

  layout:
    zll_mass_4e_sscr:
      - zll_mass_4e_sscr
    zll_mass_4mu_sscr:
      - zll_mass_4mu_sscr
    zll_mass_2e2mu_sscr:
      - zll_mass_2e2mu_sscr
    zll_mass_2mu2e_sscr:
      - zll_mass_2mu2e_sscr
    lep1:
      - l1_pt
      - l1_eta
      - l1_flavor
      - l1_missing_hits
    lep2:
      - l2_pt
      - l2_eta
      - l2_flavor
      - l2_missing_hits
    jet_global:
      - cjet_HT