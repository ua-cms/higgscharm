# HcZZ final workflow (2026-11-13), one workflow for background and signal (smsignal); same selection, corrections and
# weights as hplusc_mva_4class_ctag2d_final_{bkg,fschad} (CJLST-aligned leptons, HZZ lepton SFs on the 4 candidate leptons,
# Run-3 ZZ k-factors, 2D c-tag SF, JES Regrouped + JER per era, lepton scale/smearing shifts), but the parquet output keeps
# only what is used downstream:
#   - inputs of the final MVA n2_noid_dd_both (63 features; PNet CvL/CvB/B for 2022/23, UParTAK4 for 2024+, both stored),
#   - the coffea-2026 zzto4l workflow variables,
#   - what the datacard builder, Z+X chain and bookkeeping read (m4l, Z masses, n_cjet, cjet_HT, final-state masses).
# Weights, LHE m4l/|cos theta*|, GEN c-jet / c-hadron columns are added by the processor.
datasets:
  data:
  - muon
  - double_muon
  - electron
  - double_electron
  - muon_electron
  mc:
  - higgs
  - hb
  - qqtozz
  - ggtozz
  - dy_nlo
  signal:
  - smsignal
object_selection:
  muons:
    field: events.Muon
    add_cut:
      is_loose:
      - events.Muon.pt > 5
      - np.abs(events.Muon.eta) < 2.4
      - np.abs(events.Muon.dxy) < 0.5
      - np.abs(events.Muon.dz) < 1
      - events.Muon.isGlobal | events.Muon.isTracker
      is_relaxed:
      - objects['muons'].is_loose
      - np.abs(events.Muon.sip3d) < 4
      is_tight:
      - objects['muons'].is_loose
      - objects['muons'].is_relaxed
      - events.Muon.isPFcand | ((events.Muon.highPtId > 0) & (events.Muon.pt > 200))
  electrons:
    field: events.Electron
    add_cut:
      is_loose:
      - events.Electron.pt > 7
      - np.abs(events.Electron.eta) < 2.5
      - np.abs(events.Electron.dxy) < 0.5
      - np.abs(events.Electron.dz) < 1
      is_relaxed:
      - objects['electrons'].is_loose
      - np.abs(events.Electron.sip3d) < 4
      is_tight:
      - objects['electrons'].is_loose
      - objects['electrons'].is_relaxed
      - working_points.electron_id(events, 'bdt', year)
  fsr_photons:
    field: events.FsrPhoton
    cuts:
    - events.FsrPhoton.pt > 2
    - np.abs(events.FsrPhoton.eta) < 2.4
    - events.FsrPhoton.relIso03 < 1.8
  leptons:
    field: select_zzto4l_leptons_hczz
  zcandidates:
    field: select_zcandidates_hczz
    add_cut:
      is_ossf:
      - objects['zcandidates'].l1.pdgId == -objects['zcandidates'].l2.pdgId
      is_sr:
      - objects['zcandidates'].is_ossf
      - objects['zcandidates'].l1.is_tight & objects['zcandidates'].l2.is_tight
    cuts:
    - (objects['zcandidates'].p4.mass > 12) & (objects['zcandidates'].p4.mass < 120)
  zzcandidates:
    field: select_zzcandidates
    cuts:
    - objects['zzcandidates'].z1.is_sr & objects['zzcandidates'].z2.is_sr
    - (objects['zzcandidates'].z1.p4 + objects['zzcandidates'].z2.p4).mass > 70
  best_zzcandidate:
    field: select_best_zzcandidate
  zz_mass_4mu:
    field: select_mass_4mu_sr
  zz_mass_4e:
    field: select_mass_4e_sr
  zz_mass_2mu2e:
    field: select_mass_2mu2e_sr
  zz_mass_2e2mu:
    field: select_mass_2e2mu_sr
  jets:
    field: events.Jet
    cuts:
    - events.Jet.pt > 20
    - np.abs(events.Jet.eta) < 2.5
    - working_points.jet_id(events, year, 'tightlepveto')
    - delta_r_higher(events.Jet, objects['leptons'], 0.4)
  cjets:
    field: events.Jet
    cuts:
    - events.Jet.pt > 20
    - np.abs(events.Jet.eta) < 2.5
    - working_points.jet_id(events, year, 'tightlepveto')
    - delta_r_higher(events.Jet, objects['leptons'], 0.4)
    - working_points.jet_ctagging(events, 'loose', year)
  zzcandidate_cjet_dphi_inclusive:
    field: select_dphi_inclusive
  zzcandidate_jet_dphi_inclusive:
    field: select_jet_dphi_inclusive
  zzcandidate_cjet_dphi_4e:
    field: select_dphi_4e
  zzcandidate_cjet_dphi_4mu:
    field: select_dphi_4mu
  zzcandidate_cjet_dphi_2mu2e:
    field: select_dphi_2mu2e
  zzcandidate_cjet_dphi_2e2mu:
    field: select_dphi_2e2mu
event_selection:
  hlt_paths:
  - SingleMu
  - DiMu
  - TriMu
  - SingleEle
  - DiEle
  - MuEle
  selections:
    trigger: get_zzto4l_trigger_mask(events, hlt_paths, dataset, year)
    lumimask: get_lumi_mask(events, year)
    atleast_one_goodvertex: events.PV.npvsGood > 0
    atleast_one_zz: ak.num(objects['zzcandidates']) >= 1
    atleast_one_cjet: ak.num(objects['cjets']) >= 1
  categories:
    base:
    - trigger
    - lumimask
    - atleast_one_goodvertex
    - atleast_one_zz
    - atleast_one_cjet
corrections:
  objects:
  - jec_shifts
  - jes_regrouped
  - jet_vetomaps
  - muon_ss
  - electon_ss
  event_weights:
    genWeight: true
    pileupWeight: true
    partonshowerWeight: true
    lhepdfWeight: true
    lhescaleWeight: true
    nnlopsWeight: true
    higgsHFWeight: true
    muon:
    - id: false
    - iso: false
    - trigger: false
    electron:
    - id: false
    - reco: false
    - trigger: false
    hzz_leptons: true
    zz_kfactors: true
    ctagging_2d: true
mva_config:
  enabled: true
  num_classes: 4
  class_names:
  - qqZZ
  - ggZZ
  - Signal
  - Other_Higgs
  class_descriptions:
    qqZZ: "qq\u2192ZZ continuum background"
    ggZZ: "gg\u2192ZZ continuum background"
    Signal: H+c signal (target)
    Other_Higgs: Combined HPlusB + ggH + Other backgrounds
  mass_window:
    min: 100
    max: 150
histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    zz_mass_inclusive:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\ell}$ [GeV]
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).mass
    zz_pt_inclusive:
      type: Regular
      bins: 40
      start: 0
      stop: 400
      label: $p_T(4\ell)$ [GeV]
      expression: objects['best_zzcandidate'].p4.pt
    zz_eta_inclusive:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(4\ell)$
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).eta
    zz_phi_inclusive:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(4\ell)$
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).phi
    m4l:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\ell}$ [GeV]
      expression: (objects['best_zzcandidate'].z1.p4 + objects['best_zzcandidate'].z2.p4).mass
    zz_mass_4mu:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4\mu}$ [GeV]
      expression: objects['zz_mass_4mu']
    zz_mass_4e:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{4e}$ [GeV]
      expression: objects['zz_mass_4e']
    zz_mass_2mu2e:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{2\mu 2e}$ [GeV]
      expression: objects['zz_mass_2mu2e']
    zz_mass_2e2mu:
      type: Regular
      bins: 66
      start: 70
      stop: 400
      label: $m_{2e2\mu}$ [GeV]
      expression: objects['zz_mass_2e2mu']
    deltaR_ZZ:
      type: Regular
      bins: 50
      start: 0
      stop: 6
      label: $\Delta R(Z_1, Z_2)$
      expression: objects['best_zzcandidate'].z1.p4.delta_r(objects['best_zzcandidate'].z2.p4)
    z1_pt:
      type: Regular
      bins: 50
      start: 0
      stop: 500
      label: $p_T(Z_1)$ [GeV]
      expression: objects['best_zzcandidate'].z1.p4.pt
    z1_mass:
      type: Regular
      bins: 54
      start: 12
      stop: 120
      label: $m(Z_1)$ [GeV]
      expression: objects['best_zzcandidate'].z1.p4.mass
    z2_pt:
      type: Regular
      bins: 50
      start: 0
      stop: 500
      label: $p_T(Z_2)$ [GeV]
      expression: objects['best_zzcandidate'].z2.p4.pt
    z2_mass:
      type: Regular
      bins: 54
      start: 12
      stop: 120
      label: $m(Z_2)$ [GeV]
      expression: objects['best_zzcandidate'].z2.p4.mass
    z1_l1_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_1^{Z_1})$ [GeV]
      expression: objects['best_zzcandidate'].z1.l1.pt
    z1_l1_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_1^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l1.eta
    z1_l1_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_1^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l1.phi
    z1_l2_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_2^{Z_1})$ [GeV]
      expression: objects['best_zzcandidate'].z1.l2.pt
    z1_l2_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_2^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l2.eta
    z1_l2_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_2^{Z_1})$
      expression: objects['best_zzcandidate'].z1.l2.phi
    z2_l1_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_1^{Z_2})$ [GeV]
      expression: objects['best_zzcandidate'].z2.l1.pt
    z2_l1_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_1^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l1.eta
    z2_l1_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_1^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l1.phi
    z2_l2_pt:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_2^{Z_2})$ [GeV]
      expression: objects['best_zzcandidate'].z2.l2.pt
    z2_l2_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_2^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l2.eta
    z2_l2_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_2^{Z_2})$
      expression: objects['best_zzcandidate'].z2.l2.phi
    lepton_charge:
      type: Regular
      bins: 3
      start: -1.5
      stop: 1.5
      label: Lepton charge
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.charge, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.charge, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.charge, 0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.charge, 0))])
    lepton_pfRelIso03_all:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Lepton PF RelIso03
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.pfRelIso03_all, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.pfRelIso03_all, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.pfRelIso03_all, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.pfRelIso03_all, 0.0))])
    lepton_sip3d:
      type: Regular
      bins: 50
      start: 0
      stop: 10
      label: Lepton SIP3D
      expression: np.column_stack([ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l1.sip3d, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z1.l2.sip3d, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l1.sip3d, 0.0)), ak.to_numpy(ak.fill_none(objects['best_zzcandidate'].z2.l2.sip3d, 0.0))])
    jet_multiplicity:
      type: Integer
      start: 0
      stop: 14
      label: Jet Multiplicity
      expression: ak.num(objects['jets'])
    jet_ht:
      type: Regular
      bins: 50
      start: 0
      stop: 1000
      label: $H_T$ (Jets) [GeV]
      expression: ak.sum(objects['jets'].pt, axis=1)
    jet_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: Jets $p_T$ [GeV]
      expression: objects['jets'].pt
    jet_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: Jets $\eta$
      expression: objects['jets'].eta
    jet_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: Jets $\phi$
      expression: objects['jets'].phi
    jet_btagPNetB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet B
      expression: objects['jets'].btagPNetB
    jet_btagPNetCvL:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet CvL
      expression: objects['jets'].btagPNetCvL
    jet_btagPNetCvB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet CvB
      expression: objects['jets'].btagPNetCvB
    jet_btagUParTAK4B:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets UParT B
      expression: objects['jets'].btagUParTAK4B if 'btagUParTAK4B' in objects['jets'].fields else ak.full_like(objects['jets'].pt, -1)
    jet_btagUParTAK4CvL:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets UParT CvL
      expression: objects['jets'].btagUParTAK4CvL if 'btagUParTAK4CvL' in objects['jets'].fields else ak.full_like(objects['jets'].pt, -1)
    jet_btagUParTAK4CvB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets UParT CvB
      expression: objects['jets'].btagUParTAK4CvB if 'btagUParTAK4CvB' in objects['jets'].fields else ak.full_like(objects['jets'].pt, -1)
    leadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsL
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvL, 0.0)
    leadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Leading Jet CvsB
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 0].btagPNetCvB, 0.0)
    leadingjet_flavour:
      type: IntCategory
      categories:
      - 0
      - 4
      - 5
      label: Leading Jet HadronFlavour
      expression: ak.pad_none(objects['jets'], target=2)[:, 0].hadronFlavour
    subleadingjet_cvsl:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Subleading Jet CvsL
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 1].btagPNetCvL, 0.0)
    subleadingjet_cvsb:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Subleading Jet CvsB
      expression: ak.fill_none(ak.pad_none(objects['jets'], target=2)[:, 1].btagPNetCvB, 0.0)
    subleadingjet_flavour:
      type: IntCategory
      categories:
      - 0
      - 4
      - 5
      label: Subleading Jet HadronFlavour
      expression: ak.pad_none(objects['jets'], target=2)[:, 1].hadronFlavour
    n_cjet:
      type: Integer
      start: 0
      stop: 14
      label: c-Jet Multiplicity
      expression: ak.num(objects['cjets'])
    cjets_multiplicity:
      type: Integer
      start: 0
      stop: 14
      label: c-Jet Multiplicity
      expression: ak.num(objects['cjets'])
    cjet_HT:
      type: Regular
      bins: 50
      start: 0
      stop: 1000
      label: $H_T$ (c-Jets) [GeV]
      expression: ak.sum(objects['cjets'].pt, axis=1)
    cjets_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: c-Jet $p_T$ [GeV]
      expression: objects['cjets'].pt
    cjets_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: c-Jet $\eta$
      expression: objects['cjets'].eta
    cjets_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: c-Jet $\phi$
      expression: objects['cjets'].phi
    cjets_h_dphi_inclusive:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4\ell})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_inclusive'])
    jets_h_dphi_inclusive:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{Jet}, H_{4\ell})|$
      expression: np.abs(objects['zzcandidate_jet_dphi_inclusive'])
    leadingcjets_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: PNet c-tagged (M) Leading Jet $p_T$ [GeV]
      expression: ak.pad_none(objects['cjets'], target=2)[:, 0].pt
    leadingcjets_eta:
      type: Regular
      bins: 50
      start: -2.4
      stop: 2.4
      label: PNet c-tagged (M) Leading Jet $\eta$
      expression: ak.pad_none(objects['cjets'], target=2)[:, 0].eta
    leadingcjets_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: PNet c-tagged (M) Leading Jet $\phi$
      expression: ak.pad_none(objects['cjets'], target=2)[:, 0].phi
    cjets_h_dphi_4e:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4e})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_4e'])
    cjets_h_dphi_4mu:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{4\mu})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_4mu'])
    cjets_h_dphi_2mu2e:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{2\mu 2e})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_2mu2e'])
    cjets_h_dphi_2e2mu:
      type: Regular
      bins: 50
      start: 0
      stop: 3.14159
      label: $|\Delta \phi(\text{c-Jet}, H_{2e2\mu})|$
      expression: np.abs(objects['zzcandidate_cjet_dphi_2e2mu'])
  layout:
    zz_inclusive:
    - zz_mass_inclusive
    - zz_pt_inclusive
    - zz_eta_inclusive
    - deltaR_ZZ
    z_kinematics:
    - z1_pt
    - z1_mass
    - z2_pt
    - z2_mass
    zz_mass_4e:
    - zz_mass_4e
    zz_mass_4mu:
    - zz_mass_4mu
    zz_mass_2e2mu:
    - zz_mass_2e2mu
    zz_mass_2mu2e:
    - zz_mass_2mu2e
    jet_global:
    - jet_multiplicity
    - jet_ht
    jet:
    - jet_pt
    - jet_eta
    - jet_phi
    jet_tagging:
    - jet_btagPNetB
    - jet_btagPNetCvL
    - jet_btagPNetCvB
    leading_jet:
    - leadingjet_flavour
    - leadingjet_cvsl
    - leadingjet_cvsb
    subleading_jet:
    - subleadingjet_flavour
    - subleadingjet_cvsl
    - subleadingjet_cvsb
    cjet:
    - cjets_pt
    - cjets_eta
    - cjets_phi
    - cjets_h_dphi_inclusive
    leptons:
    - z1_l1_pt
    - z1_l2_pt
    - z2_l1_pt
    - z2_l2_pt
    leading_cjet:
    - leadingcjets_pt
    - leadingcjets_eta
    - leadingcjets_phi
    cjet_dphi_final_state:
    - cjets_h_dphi_4e
    - cjets_h_dphi_4mu
    - cjets_h_dphi_2mu2e
    - cjets_h_dphi_2e2mu
